name: Deploy to Cloudflare Workers

# 发布工作流：push 到 main 自动部署，也保留手动触发。
# 上游同步（sync-upstream.yaml）合并后 push 到 main 会自动触发本工作流。
# 所需仓库 Secrets：CF_API_TOKEN、CF_ACCOUNT_ID。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    name: build + deploy (workerd)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build OpenNext bundle
        run: npm run build:cf

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
