name: Sync upstream

# 定时把上游 hotier/MediaGet 的 main 合并进本 fork；
# 有更新时 push 到 main，并显式触发 deploy-cloudflare.yaml 部署。
# 用 workflow_dispatch 触发部署，因为 GITHUB_TOKEN 的 push 不会触发其它 workflow。
on:
  schedule:
    - cron: '0 */6 * * *' # 每 6 小时检查一次
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Sync fork with upstream
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/hotier/MediaGet.git
          git fetch upstream main

      - name: Merge upstream into main
        id: merge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout main
          BEFORE=$(git rev-parse HEAD)
          if git merge --no-edit upstream/main; then
            AFTER=$(git rev-parse HEAD)
            if [ "$BEFORE" != "$AFTER" ]; then
              git push origin main
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "Merged upstream and pushed ($BEFORE -> $AFTER)."
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "Already up to date."
            fi
          else
            echo "Merge conflict detected; please resolve manually."
            git merge --abort
            exit 1
          fi

      - name: Trigger deployment
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-cloudflare.yaml --ref main
